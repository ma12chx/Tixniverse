name: Tixniverse

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-supabase:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: exaoxclqlmqmpjynzdzf

    steps:
      # 1. Checkout the repository
      - name: 1. Checkout code
        uses: actions/checkout@v4

      # 2. Setup Supabase
      - name: 2. Setup Supabase CLI
        uses: supabase/setup-cli@v1

      # 3. Check DB Password
      - name: 3. Check DB password os set
        run: '[ -n "$SUPABASE_DB_PASSWORD" ] || (echo "SUPABASE_DB_PASSWORD is empty" && exit 1)'

      # 4. Link the project
      - name: 3. Link Project
        run: supabase link --project-ref $PROJECT_ID

      # 5. Push migrations
      - name: 4. Push Migrations
        run: supabase db push -p "$SUPABASE_DB_PASSWORD"

  build-deploy:
    runs-on: ubuntu-latest
    needs: deploy-supabase

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_OWNER_EMAIL: ${{ secrets.VITE_OWNER_EMAIL }}

    steps:
      # 1. Checkout the repository
      - name: 1. Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install Dependencies
      - name: 3. Install Dependencies
        run: npm install

      # 4. Check Supabase env
      - name: 4. Check Supabase env
        run: |
          [ -n "$VITE_SUPABASE_URL" ] || (echo "VITE_SUPABASE_URL is empty" && exit 1)
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || (echo "VITE_SUPABASE_PUBLISHABLE_KEY is empty" && exit 1)
          [ -n "$VITE_OWNER_EMAIL" ] || (echo "VITE_OWNER_EMAIL is empty" && exit 1)

      # 5. Build the project
      - name: 5. Build Project
        run: npm run build

      # 6. Deploy to github pages
      - name: 6. Deploy to Github
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
